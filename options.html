<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载来源路径设置</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1 data-i18n="optionsTitle">下载来源路径设置</h1>
        <p data-i18n="subtitle">网址只用于提取域名；路径相对于 Chrome 的默认下载目录。子域名配置优先于主域名。</p>
      </div>
      <button id="add" class="secondary" type="button" data-i18n="addRule">＋ 添加规则</button>
    </header>

    <section class="setting-card">
      <label class="language-row" for="interface-language">
        <span>
          <strong data-i18n="language">界面语言</strong>
          <small data-i18n="languageHelp">选择设置页和插件弹窗使用的语言。</small>
        </span>
        <select id="interface-language">
          <option value="zh_CN" data-i18n="chinese">中文</option>
          <option value="en" data-i18n="english">English</option>
        </select>
      </label>
      <label class="switch-row" for="distinguish-ports">
        <span>
          <strong data-i18n="distinguishPorts">区分端口</strong>
          <small data-i18n="portsHelp">开启后，localhost:3000 与 localhost:8080 可以分别配置不同目录。</small>
        </span>
        <input id="distinguish-ports" type="checkbox">
      </label>
      <div class="config-actions">
        <span>
          <strong data-i18n="backup">备份与恢复</strong>
          <small data-i18n="backupHelp">将规则导出为 JSON 文件，或从备份文件合并导入。来源相同但路径或 Tag 不同时，可逐项选择需要保留的值。</small>
        </span>
        <div class="action-buttons">
          <button id="import" class="secondary" type="button" data-i18n="importConfig">导入配置</button>
          <button id="export" class="secondary" type="button" data-i18n="exportConfig">导出配置</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="table-head">
        <span data-i18n="source">来源网页网址或域名</span>
        <span data-i18n="path">相对存放路径</span>
        <span data-i18n="tag">Tag</span>
        <span></span>
      </div>
      <div id="rules"></div>
      <div id="empty" class="empty" data-i18n="empty">尚未配置规则。所有下载均使用浏览器原本的路径。</div>
    </section>

    <footer>
      <span id="status" role="status"></span>
      <button id="save" type="button" data-i18n="save">保存设置</button>
    </footer>
  </main>

  <template id="rule-template">
    <div class="rule">
      <label>
        <span class="mobile-label" data-i18n="source">来源网页网址或域名</span>
        <input class="source" type="text" data-i18n-placeholder="sourcePlaceholder" placeholder="例如：example.com 或 localhost:3000" spellcheck="false">
      </label>
      <label>
        <span class="mobile-label" data-i18n="path">相对存放路径</span>
        <input class="path" type="text" data-i18n-placeholder="pathPlaceholder" placeholder="例如：工作/Example（留空则保持原路径）" spellcheck="false">
      </label>
      <label>
        <span class="mobile-label" data-i18n="tag">Tag</span>
        <input class="tag" type="text" value="default" placeholder="default" maxlength="50" spellcheck="false">
      </label>
      <button class="remove" type="button" data-i18n="remove" data-i18n-title="removeTitle" title="删除此规则" aria-label="删除此规则">删除</button>
      <div class="error"></div>
    </div>
  </template>

  <template id="tag-group-template">
    <details class="tag-group" open>
      <summary>
        <span class="collapse-icon" aria-hidden="true">▶</span>
        <span class="tag-name"></span>
        <span class="tag-count"></span>
      </summary>
      <div class="tag-rules"></div>
    </details>
  </template>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
